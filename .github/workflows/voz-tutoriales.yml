name: voz-tutoriales
on:
  push:
    branches: [voz-tutoriales]
    paths: ['tts/pedido.json']
permissions:
  contents: write
jobs:
  tts:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install --upgrade edge-tts
      - run: python tts/generar.py
        timeout-minutes: 25
      - run: |
          git config user.name "voz-bot"; git config user.email "voz-bot@users.noreply.github.com"
          git add tts/out
          git commit -m "audios" || echo nada
          git push
