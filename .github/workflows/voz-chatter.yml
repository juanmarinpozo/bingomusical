name: voz-chatter
on:
  push:
    branches: [voz-tutoriales]
    paths: ['tts/pedido-chatter.json']
permissions:
  contents: write
jobs:
  c:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - run: pip install chatterbox-tts
      - run: python tts/chatter.py ${{ matrix.shard }} 8
        continue-on-error: true
      - name: subir
        if: always()
        run: |
          git config user.name voz-bot; git config user.email voz-bot@users.noreply.github.com
          git add tts/out/c; git commit -m "chatter ${{ matrix.shard }}" || exit 0
          for i in 1 2 3 4 5 6 7 8; do git pull --rebase -q && git push -q && break; sleep $((RANDOM % 10 + 3)); done
