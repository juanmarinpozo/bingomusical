name: voz-melo
on:
  push:
    branches: [voz-tutoriales]
    paths: ['tts/pedido-melo.json']
permissions:
  contents: write
jobs:
  c:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - run: pip install git+https://github.com/myshell-ai/MeloTTS.git && python -m unidic download
      - run: python tts/melo.py ${{ matrix.shard }} 4 2>&1 | tail -c 20000 > /tmp/melo-${{ matrix.shard }}.txt; cp /tmp/melo-${{ matrix.shard }}.txt tts/out/m/salida-${{ matrix.shard }}.txt || true
        continue-on-error: true
      - name: subir
        if: always()
        run: |
          git config user.name voz-bot; git config user.email voz-bot@users.noreply.github.com
          mkdir -p tts/out/m; pip freeze > tts/out/m/pip-${{ matrix.shard }}.txt; git add tts/out/m; git commit -m "melo ${{ matrix.shard }}" || exit 0
          for i in 1 2 3 4 5 6 7 8; do git pull --rebase -q && git push -q && break; sleep $((RANDOM % 10 + 3)); done
